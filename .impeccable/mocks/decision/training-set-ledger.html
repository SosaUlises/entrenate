<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<style>
*{box-sizing:border-box}body{margin:0;width:390px;height:667px;overflow:hidden;background:#0c0c12;color:#f5f5f7;font:15px Manrope,system-ui,sans-serif}.screen{height:100%;padding:18px 16px 14px}.top{height:44px;display:flex;align-items:center;gap:12px}.icon{width:44px;height:44px;display:grid;place-items:center;color:#a78bfa;font-size:24px}.status{flex:1;color:#a1a1aa;font-size:13px;font-weight:700;letter-spacing:.08em}.more{font-size:24px;color:#a1a1aa}.progress{margin:10px 0 15px;display:flex;align-items:center;gap:10px}.progress i{height:3px;background:#20222e;flex:1}.progress i span{display:block;width:36%;height:100%;background:#8b5cf6}.progress b{font-size:13px;color:#3b82f6}.exercise{font:700 28px/1.08 Raleway,system-ui,sans-serif;margin:0}.target{margin-top:8px;color:#a1a1aa;font-size:13px}.target strong{color:#f5f5f7}.ledger{margin-top:16px;border-top:1px solid rgba(255,255,255,.1)}.row{min-height:54px;border-bottom:1px solid rgba(255,255,255,.1);padding:8px 0;display:grid;grid-template-columns:42px 1fr auto;align-items:center;gap:10px}.num{font:700 18px Raleway;color:#a1a1aa}.done .num,.done .value{color:#22c55e}.value{font:700 15px Raleway}.state{font-size:13px;color:#a1a1aa}.current{padding:13px 8px;display:block}.current-head{display:flex;align-items:center;justify-content:space-between}.current .num{font-size:28px;color:#a78bfa}.current .state{color:#a78bfa;font-weight:700}.metrics{display:grid;grid-template-columns:1.15fr 1fr;gap:10px;margin-top:12px}.metric{background:#171923;border-radius:12px;padding:9px 11px}.metric label{font-size:13px;color:#a1a1aa;font-weight:700}.metric strong{display:block;font:700 34px/1 Raleway;margin-top:5px}.metric small{font:700 13px Manrope;color:#a1a1aa}.rir{display:flex;gap:7px;margin-top:11px}.pill{height:40px;flex:1;background:#171923;border-radius:12px;display:grid;place-items:center;font:700 15px Raleway}.pill.on{background:#8b5cf6;color:#0c0c12}.cta{height:52px;border-radius:12px;background:#8b5cf6;margin-top:13px;display:grid;place-items:center;font-size:19px;font-weight:800}.homebar{width:120px;height:4px;background:#a1a1aa;border-radius:9999px;margin:13px auto 0;opacity:.55}
</style>
</head>
<body><main class="screen">
<header class="top"><div class="icon">‹</div><div class="status">ENTRENAMIENTO EN CURSO</div><div class="more">⋯</div></header>
<div class="progress"><i><span></span></i><b>02 / 06</b></div>
<h1 class="exercise">Press banca con barra</h1><p class="target">Objetivo · <strong>8–10 reps · RIR 1–2 · 120 s</strong></p>
<section class="ledger"><div class="row done"><span class="num">01</span><span class="value">100 kg · 8 reps · RIR 1</span><span class="state">✓</span></div><div class="row current"><div class="current-head"><span class="num">SERIE 02 / 04</span><span class="state">ACTUAL</span></div><div class="metrics"><div class="metric"><label>PESO</label><strong>100 <small>KG</small></strong></div><div class="metric"><label>REPETICIONES</label><strong>8</strong></div></div><div class="rir"><div class="pill">0</div><div class="pill on">1</div><div class="pill">2</div><div class="pill">3</div><div class="pill">4</div></div></div><div class="row"><span class="num">03</span><span class="value">Pendiente</span><span class="state">—</span></div></section>
<div class="cta">Completar serie</div><div class="homebar"></div>
</main></body></html>
