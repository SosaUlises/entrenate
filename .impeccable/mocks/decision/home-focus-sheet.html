<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<style>
@import url('https://fonts.googleapis.com/css2?family=Manrope:wght@400;600;700&family=Raleway:wght@600;700;800&display=swap');
*{box-sizing:border-box}body{margin:0;background:#0c0c12;color:#f5f5f7;font-family:Manrope,system-ui,sans-serif}.phone{position:relative;width:390px;height:844px;overflow:hidden;background:#0c0c12;padding:28px 20px 94px}.top{display:flex;align-items:center;justify-content:space-between}.hello{font:700 24px/1.1 Raleway,sans-serif;margin:0}.sub{margin:6px 0 0;color:#a1a1aa;font-size:13px}.avatar{display:grid;width:44px;height:44px;place-items:center;border:1px solid rgba(167,139,250,.5);border-radius:50%;background:rgba(167,139,250,.12);color:#a78bfa;font:700 15px Raleway}.heading{margin:44px 0 0;font:800 34px/1.02 Raleway}.intro{margin:10px 0 22px;color:#a1a1aa;font-size:14px;line-height:1.55}.list{padding-top:8px;border-top:1px solid rgba(255,255,255,.1)}.row{display:flex;min-height:86px;align-items:center;gap:14px;padding:12px 4px;border-bottom:1px solid rgba(255,255,255,.1)}.num{color:#a78bfa;font:700 14px Raleway}.content{flex:1}.name{font:700 19px/1.25 Raleway}.meta{margin-top:5px;color:#a1a1aa;font-size:13px}.chev{color:#a1a1aa;font-size:24px}.history{margin-top:22px;color:#a1a1aa;font-size:13px;font-weight:600}.dim{position:absolute;inset:0;background:rgba(5,5,9,.48)}.sheet{position:absolute;left:8px;right:8px;bottom:0;padding:10px 20px 28px;border:1px solid rgba(255,255,255,.12);border-bottom:0;border-radius:24px 24px 0 0;background:#20222e;box-shadow:0 -12px 32px rgba(0,0,0,.26)}.handle{width:40px;height:4px;margin:0 auto 20px;border-radius:99px;background:rgba(255,255,255,.16)}.sheet-title{margin:0 0 6px;font:700 26px Raleway}.sheet-copy{margin:0 0 14px;color:#a1a1aa;font-size:13px}.day{display:flex;min-height:64px;align-items:center;padding:10px 0;border-top:1px solid rgba(255,255,255,.1)}.day b{flex:1;font:700 16px Raleway}.day span{color:#a1a1aa;font-size:13px}.day i{margin-left:12px;color:#a78bfa;font-style:normal;font-size:22px}.nav{position:absolute;left:16px;right:16px;bottom:12px;display:grid;grid-template-columns:repeat(4,1fr);gap:3px;padding:4px;border:1px solid rgba(255,255,255,.08);border-radius:999px;background:rgba(32,34,46,.95)}.nav span{display:grid;min-height:50px;place-items:center;border-radius:999px;color:#a1a1aa;font-size:13px;font-weight:600}.nav .active{background:rgba(167,139,250,.1);color:#a78bfa}
</style>
</head>
<body><main class="phone">
<header class="top"><div><h1 class="hello">Buen día, Ulises.</h1><p class="sub">¿Qué querés entrenar?</p></div><div class="avatar">U</div></header>
<h2 class="heading">Elegí una rutina.</h2><p class="intro">Tus rutinas, listas para empezar.</p>
<section class="list"><div class="row"><span class="num">01</span><div class="content"><div class="name">Push</div><div class="meta">2 días</div></div><span class="chev">›</span></div><div class="row"><span class="num">02</span><div class="content"><div class="name">Piernas</div><div class="meta">1 día</div></div><span class="chev">›</span></div><div class="row"><span class="num">03</span><div class="content"><div class="name">Espalda + bíceps</div><div class="meta">2 días</div></div><span class="chev">›</span></div></section>
<div class="history">Ver actividad reciente →</div><nav class="nav"><span class="active">Inicio</span><span>Rutinas</span><span>Progreso</span><span>Ejercicios</span></nav>
<div class="dim"></div><section class="sheet"><div class="handle"></div><h3 class="sheet-title">Push</h3><p class="sheet-copy">Elegí un día para empezar.</p><div class="day"><b>Push A</b><span>4 ejercicios</span><i>›</i></div><div class="day"><b>Push B</b><span>5 ejercicios</span><i>›</i></div></section>
</main></body></html>
