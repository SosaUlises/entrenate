<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<style>
@import url('https://fonts.googleapis.com/css2?family=Manrope:wght@400;600;700&family=Raleway:wght@600;700;800&display=swap');
*{box-sizing:border-box}body{margin:0;background:#0c0c12;color:#f5f5f7;font-family:Manrope,system-ui,sans-serif}.phone{position:relative;width:390px;height:844px;overflow:hidden;padding:28px 20px 94px;background:#0c0c12}.top{display:flex;align-items:center;justify-content:space-between}.hello{margin:0;font:700 24px/1.1 Raleway}.sub{margin:6px 0 0;color:#a1a1aa;font-size:13px}.avatar{display:grid;width:44px;height:44px;place-items:center;border:1px solid rgba(167,139,250,.5);border-radius:50%;background:rgba(167,139,250,.12);color:#a78bfa;font:700 15px Raleway}.heading{margin:40px 0 0;font:800 34px/1.02 Raleway}.intro{margin:10px 0 20px;color:#a1a1aa;font-size:14px}.list{padding-top:8px;border-top:1px solid rgba(255,255,255,.1)}.routine{padding:8px 4px;border-bottom:1px solid rgba(255,255,255,.1)}.row{display:flex;min-height:78px;align-items:center;gap:14px;padding:10px 4px}.num{color:#a78bfa;font:700 14px Raleway}.content{flex:1}.name{font:700 19px/1.25 Raleway}.meta{margin-top:4px;color:#a1a1aa;font-size:13px}.chev{color:#a1a1aa;font-size:22px}.routine.open{margin:0 -8px;padding:8px 12px;background:rgba(23,25,35,.72);border-radius:16px}.routine.open .row{border-bottom:1px solid rgba(255,255,255,.08)}.routine.open .name{color:#a78bfa}.days{padding-left:30px}.day{display:flex;min-height:61px;align-items:center;padding:8px 0;border-bottom:1px solid rgba(255,255,255,.07)}.day:last-child{border:0}.day-main{flex:1}.day b{font:700 15px Raleway}.day small{display:block;margin-top:4px;color:#a1a1aa;font-size:13px}.go{display:grid;width:44px;height:44px;place-items:center;color:#a78bfa;font-size:22px}.history{margin-top:20px;color:#a1a1aa;font-size:13px;font-weight:600}.nav{position:absolute;left:16px;right:16px;bottom:12px;display:grid;grid-template-columns:repeat(4,1fr);gap:3px;padding:4px;border:1px solid rgba(255,255,255,.08);border-radius:999px;background:rgba(32,34,46,.95)}.nav span{display:grid;min-height:50px;place-items:center;border-radius:999px;color:#a1a1aa;font-size:13px;font-weight:600}.nav .active{background:rgba(167,139,250,.1);color:#a78bfa}
</style>
</head>
<body><main class="phone">
<header class="top"><div><h1 class="hello">Buen día, Ulises.</h1><p class="sub">¿Qué querés entrenar?</p></div><div class="avatar">U</div></header>
<h2 class="heading">Elegí una rutina.</h2><p class="intro">Tus rutinas, listas para empezar.</p>
<section class="list"><div class="routine open"><div class="row"><span class="num">01</span><div class="content"><div class="name">Push</div><div class="meta">2 días</div></div><span class="chev">⌃</span></div><div class="days"><div class="day"><div class="day-main"><b>Push A</b><small>4 ejercicios</small></div><span class="go">›</span></div><div class="day"><div class="day-main"><b>Push B</b><small>5 ejercicios</small></div><span class="go">›</span></div></div></div><div class="routine"><div class="row"><span class="num">02</span><div class="content"><div class="name">Piernas</div><div class="meta">1 día</div></div><span class="chev">›</span></div></div><div class="routine"><div class="row"><span class="num">03</span><div class="content"><div class="name">Espalda + bíceps</div><div class="meta">2 días</div></div><span class="chev">›</span></div></div></section>
<div class="history">Ver actividad reciente →</div><nav class="nav"><span class="active">Inicio</span><span>Rutinas</span><span>Progreso</span><span>Ejercicios</span></nav>
</main></body></html>
